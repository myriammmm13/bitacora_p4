<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repositorio P4</title>
    <link rel="icon" type="image/jpg" href="../img/ditto.jpg">

    <link rel="stylesheet" href="../css/style.css">

    <style>
        #game-board {
            display: grid;
            grid-template-columns: repeat(10, 40px);
            gap: 2px;
            justify-content: center;
            margin-top: 40px;
        }

        .cell {
            width: 40px;
            height: 40px;
            background: #1e1e2a;
            border: 1px solid #333;
        }

        .player {
            background: yellow;
            border-radius: 50%;
        }

        .enemy {
            background: red;
            border-radius: 50%;
        }
    </style>

</head>

<body>

    <header class="header">

        <div class="container-custom nav-container">

            <a href="../index.html" class="logo">
                MJ Watson
            </a>
            <nav class="nav-links">
                <a href="../index.html">Home</a>
            </nav>

        </div>

    </header>

    <section class="content-section container-custom">

        <h1 class="section-title">Juego tipo Pac-Man</h1>

        <div id="game-board"></div>

    </section>

    <script>

        const board = document.getElementById("game-board");

        const cells = [];

        for (let i = 0; i < 100; i++) {
            const cell = document.createElement("div");

            cell.classList.add("cell");

            board.appendChild(cell);

            cells.push(cell);
        }

        let playerPosition = 0;
        let enemyPosition = 99;

        cells[playerPosition].classList.add("player");
        cells[enemyPosition].classList.add("enemy");

        function draw() {

            cells.forEach(cell => {
                cell.classList.remove("player");
                cell.classList.remove("enemy");
            });

            cells[playerPosition].classList.add("player");
            cells[enemyPosition].classList.add("enemy");
        }

        function movePlayer(event) {

            if (event.key === "ArrowRight") {
                playerPosition++;
            }

            if (event.key === "ArrowLeft") {
                playerPosition--;
            }

            if (event.key === "ArrowDown") {
                playerPosition += 10;
            }

            if (event.key === "ArrowUp") {
                playerPosition -= 10;
            }

            if (playerPosition < 0) playerPosition = 0;
            if (playerPosition > 99) playerPosition = 99;
            draw();

            if (playerPosition === enemyPosition) {
                alert("Perdiste");
            }
        }

        function moveEnemy() {

            enemyPosition--;

            if (enemyPosition < 0) {
                enemyPosition = 99;
            }

            draw();

            if (playerPosition === enemyPosition) {
                alert("Perdiste");
            }
        }

        setInterval(moveEnemy, 500);
        document.addEventListener("keydown", movePlayer);

    </script>

</body>

</html>
