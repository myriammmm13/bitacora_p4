<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Pac-Man - Repositorio P4</title>
    <link rel="icon" type="image/jpg" href="../img/ditto.jpg">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>

    <style>
        #game-info {
            text-align: center;
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #1e1e2e;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #B14CFF;
            width: max-content;
            margin-left: auto;
            margin-right: auto;
        }

        /* REQUISITO: Interfaz visual simple pero funcional */
        #game-board {
            display: grid;
            grid-template-columns: repeat(15, 30px);
            gap: 0px;
            justify-content: center;
            margin-top: 20px;
            background-color: black;
            padding: 15px;
            border-radius: 10px;
            width: max-content;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0px 0px 20px rgba(177, 76, 255, 0.4);
        }

        .cell {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wall {
            background-color: #1919A6;
            border-radius: 4px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #FFB8AE;
            border-radius: 50%;
        }

        .player {
            width: 24px;
            height: 24px;
            background-color: yellow;
            border-radius: 50%;
            clip-path: polygon(100% 74%, 44% 48%, 100% 21%, 100% 0, 74% 0, 0 0, 0 100%, 100% 100%);
        }

        .ghost {
            width: 24px;
            height: 24px;
            border-radius: 50% 50% 0 0;
            position: relative;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="container-custom nav-container">
            <a href="../index.html" class="logo">
                Pac-Man JS
            </a>
            <nav class="nav-links">
                <a href="../index.html">Home</a>
                <a href="internet.html">Internet</a>
                <a href="html.html">HTML</a>
                <a href="css.html">CSS</a>
                <a href="backend.html">Back-End</a>
                <a href="javascript.html">JavaScript</a>
                <a href="juego.html" style="color: var(--primary2);">Juego</a>
            </nav>
        </div>
    </header>

    <section class="content-section container-custom">
        <div class="text-center mb-4 text-white">
            <h1 class="bg-purple d-inline-block px-3 py-1 rounded">Proyecto de JavaScript Puro</h1>
            <p>Usa las flechas del teclado para moverte. Come todos los puntos y evita a los fantasmas.</p>
        </div>

        <div id="game-info">Puntuación: <span id="score">0</span> / <span id="total">0</span></div>
        <div id="game-board"></div>
    </section>
    <script src="../js/juego.js"></script>

    <footer class="footer mt-5">
        <p>Proyecto Programación IV</p>
        <p>Autor: MJ Watson - 2026</p>
    </footer>

</body>

</html>
